<!doctype html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/public/tailwind.css">
    <title>Starpoint - Gacha</title>
    <style>
        .page-stack { display: flex; flex-direction: column; gap: 20px; width: 100%; }
        .page-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
        .page-heading h2 { font-size: 2.25rem; line-height: 2.5rem; font-weight: 700; }
        .page-heading p, .muted { color: var(--md-sys-color-on-surface-variant); }
        .primary-button, .secondary-button {
            min-height: 40px; padding: 0 24px; border-radius: 9999px; display: inline-flex; align-items: center;
            justify-content: center; cursor: pointer; font-size: 1rem; text-decoration: none; border: 1px solid transparent;
        }
        .primary-button { background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); }
        .secondary-button { background: transparent; color: var(--md-sys-color-on-surface); border-color: var(--md-sys-color-outline-variant); }
        .restore-panel { display: none; padding: 20px; border: 1px solid var(--md-sys-color-outline-variant); border-radius: 24px; background: var(--md-sys-color-surface-container); }
        .restore-panel.open { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; }
        .restore-panel label { display: flex; flex-direction: column; gap: 6px; min-width: 280px; flex: 1; }
        .restore-panel select { padding: 10px 12px; border-radius: 12px; background: var(--md-sys-color-surface-container-high); }
        .gacha-list { width: 100%; display: flex; flex-direction: column; gap: 20px; }
        .gacha-card { display: grid; grid-template-columns: minmax(220px, 320px) 1fr; overflow: hidden; border: 1px solid var(--md-sys-color-outline-variant); border-radius: 28px; background: var(--md-sys-color-surface-container); }
        .gacha-card.is-disabled { opacity: .64; }
        .gacha-card-art { min-height: 210px; background: var(--md-sys-color-surface-container-high); }
        .gacha-artwork { width: 100%; height: 100%; min-height: 210px; max-height: 300px; object-fit: cover; display: block; }
        .gacha-artwork-placeholder { min-height: 210px; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--md-sys-color-on-surface-variant); font-weight: 600; }
        .gacha-card-body { display: flex; flex-direction: column; gap: 14px; padding: 22px; }
        .gacha-card-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
        .gacha-card-heading h3 { font-size: 1.5rem; font-weight: 700; }
        .eyebrow { font-size: .78rem; letter-spacing: .08em; font-weight: 700; color: var(--md-sys-color-on-surface-variant); }
        .state-pill { padding: 5px 12px; border-radius: 9999px; background: var(--md-sys-color-surface-container-highest); font-weight: 600; white-space: nowrap; }
        .rate-strip { display: flex; flex-wrap: wrap; gap: 10px; }
        .rate-strip span { padding: 7px 12px; border-radius: 14px; background: var(--md-sys-color-surface-container-high); }
        .card-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: auto; }
        .empty-card { width: 100%; padding: 40px; text-align: center; border: 1px solid var(--md-sys-color-outline-variant); border-radius: 28px; }
        .status-line { min-height: 24px; color: var(--md-sys-color-on-surface-variant); }
        @media (max-width: 800px) { .gacha-card { grid-template-columns: 1fr; } }
    </style>
</head>

<body class="bg-background text-on-surface relative mt-16 m-auto max-w-screen-2xl min-h-screen box-border flex flex-col items-start px-3 pb-3">
    <header class="flex gap-3 items-center md:justify-start justify-center mb-3 w-full">
        <img src="/public/img/logo.png" class="w-9 h-9">
        <h1 class="text-4xl mt-4 font-black mb-4 text-on-background">Starpoint</h1>
    </header>
    <div class="md:grid md:grid-cols-sidebar flex flex-col gap-5 w-full h-fit">
        <nav class="px-3 py-5 gap-3 flex flex-col bg-surface-container-low rounded-3xl h-fit w-full">
            <a href="/" class="px-5 py-3 flex gap-3 items-center rounded-full hover:bg-surface-container-high text-on-surface text-lg transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" class="fill-on-surface"><path d="M520-600v-240h320v240H520ZM120-440v-400h320v400H120Zm400 320v-400h320v400H520Zm-400 0v-240h320v240H120Zm80-400h160v-240H200v240Zm400 320h160v-240H600v240Zm0-480h160v-80H600v80ZM200-200h160v-80H200v80Z"/></svg>
                Dashboard
            </a>
            <div class="px-5 py-3 flex gap-3 items-center bg-primary rounded-full w-full font-bold text-on-primary text-lg">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" class="fill-on-primary"><path d="M480-80q-82 0-155-31.5t-127.5-86Q143-252 111.5-325T80-480q0-82 31.5-155T198-762.5q54.5-54.5 127.5-86T480-880q82 0 155 31.5t127.5 86q54.5 54.5 86 127.5T880-480q0 82-31.5 155T762-197.5q-54.5 54.5-127.5 86T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm-80-160 160-160-160-160-56 56 104 104-104 104 56 56Z"/></svg>
                Gacha
            </div>
            <a href="/player" class="px-5 py-3 flex gap-3 items-center rounded-full hover:bg-surface-container-high text-on-surface text-lg transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" class="fill-on-surface"><path d="M40-160v-112q0-34 17.5-62.5T104-378q62-31 126-46.5T360-440q66 0 130 15.5T616-378q29 15 46.5 43.5T680-272v112H40Zm720 0v-120q0-44-24.5-84.5T666-434q51 6 96 20.5t84 35.5q36 20 55 44.5t19 53.5v120H760ZM360-480q-66 0-113-47t-47-113q0-66 47-113t113-47q66 0 113 47t47 113q0 66-47 113t-113 47Z"/></svg>
                Players
            </a>
            <a href="https://github.com/Duosion/starpoint" class="px-5 py-3 flex gap-3 items-center rounded-full hover:bg-surface-container-high text-on-surface text-lg transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" class="fill-on-surface"><path d="M320-240 80-480l240-240 57 57-184 184 183 183-56 56Zm320 0-57-57 184-184-183-183 56-56 240 240-240 240Z"/></svg>
                Source Code
            </a>
        </nav>
        <main class="page-stack">
            <section class="page-heading">
                <div>
                    <h2>Gacha</h2>
                    <p>Current runtime banners and their exact draw probabilities.</p>
                </div>
                <button id="add-gacha-button" type="button" class="primary-button">Add Gacha</button>
            </section>
            <form id="restore-panel" class="restore-panel">
                <label>Available seasonal slot
                    <select id="restore-select">{{restoreOptions}}</select>
                </label>
                <button type="submit" class="primary-button">Add / Restore</button>
            </form>
            <p id="page-status" class="status-line"></p>
            <ul class="gacha-list">{{listContent}}</ul>
        </main>
    </div>
    <script>
        const status = document.getElementById('page-status');
        const panel = document.getElementById('restore-panel');
        document.getElementById('add-gacha-button').addEventListener('click', () => panel.classList.toggle('open'));

        async function setEnabled(button, enabled) {
            const { season, cycle, slot } = button.dataset;
            const endpoint = `/web_api/gacha/${season}/${cycle}/${slot}${enabled ? '/enable' : ''}`;
            const response = await fetch(endpoint, { method: enabled ? 'POST' : 'DELETE' });
            const result = await response.json();
            if (!response.ok) throw new Error(result.error || 'Gacha update failed.');
        }

        document.querySelectorAll('.delete-gacha').forEach((button) => button.addEventListener('click', async () => {
            if (!confirm('Delete this gacha from the active portal? Its pool is preserved and can be restored.')) return;
            status.textContent = 'Deleting...';
            try { await setEnabled(button, false); location.reload(); }
            catch (error) { status.textContent = error instanceof Error ? error.message : String(error); }
        }));

        document.querySelectorAll('.restore-gacha').forEach((button) => button.addEventListener('click', async () => {
            status.textContent = 'Restoring...';
            try { await setEnabled(button, true); location.reload(); }
            catch (error) { status.textContent = error instanceof Error ? error.message : String(error); }
        }));

        panel.addEventListener('submit', async (event) => {
            event.preventDefault();
            const value = document.getElementById('restore-select').value;
            if (!value) { status.textContent = 'There is no disabled seasonal slot to add.'; return; }
            const [season, cycle, slot] = value.split(':');
            status.textContent = 'Adding...';
            try {
                const response = await fetch(`/web_api/gacha/${season}/${cycle}/${slot}/enable`, { method: 'POST' });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'Add failed.');
                location.reload();
            } catch (error) { status.textContent = error instanceof Error ? error.message : String(error); }
        });
    </script>
</body>

</html>
